[build]
  command = "npm run build"
  publish = "out"

# Ham Markdown kopyaları ve LLM dosyaları UTF-8 metin olarak sunulur.
[[headers]]
  for = "/docs-md/*"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/llms-full.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/search-index.json"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"

# Uzantısız üretilen Open Graph görseli
[[headers]]
  for = "/opengraph-image"
  [headers.values]
    Content-Type = "image/png"
