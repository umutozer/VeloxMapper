# Her push ve pull request'te derleme + test. Yayın yapmaz (bkz. publish.yml).
name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "website/**"
      - "docs/**"
      - "**/*.md"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - run: dotnet restore VeloxMapper.slnx
      - run: dotnet build VeloxMapper.slnx -c Release --no-restore
      - run: dotnet test tests/VeloxMapper.Tests -c Release --no-build
      - run: dotnet pack src/VeloxMapper/VeloxMapper.csproj -c Release --no-build -o artifacts
